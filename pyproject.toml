[project]
name = "napari-workshop"
version = "0.1.1"
description = "A practical workshop on rendering microscopy images, particles, and tracks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "napari[pyqt6]==0.6.6",
  "numpy>=2,<2.3", "pandas>=2.2,<3", "tifffile>=2025.1,<2026",
  "scipy>=1.15,<2", "dask[array]>=2025.1,<2027",
  "jupyterlab>=4.4,<5", "ipykernel>=6.29,<7",
  "imageio>=2.37,<3", "imageio-ffmpeg==0.6.0",
  "napari-animation>=0.0.9,<0.1", "psutil>=7,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/napari_workshop"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "nbformat>=5.10", "nbclient>=0.10"]
docs = ["sphinx>=8,<9", "myst-nb>=1.2,<2", "sphinx-book-theme>=1.1,<2"]

[tool.uv]
exclude-newer = "2026-09-10T23:59:59Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
